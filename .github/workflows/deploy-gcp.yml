name: Deploy to GCP Cloud Storage

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # id-token: write is required for WIF OIDC token generation
  id-token: write

jobs:
  deploy:
    name: Deploy Site to GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Upload dynamic content (HTML, status.json) — never cached
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: .
          destination: reneebuilds.com
          glob: '{*.html,status.json}'
          parent: false
          gzip: true
          headers: |-
            cache-control: no-cache, must-revalidate

      - name: Upload static assets — cacheable
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: .
          destination: reneebuilds.com
          glob: '{*.css,*.js,*.png,*.jpg,*.jpeg,*.svg,*.ico,*.xml,*.txt,assets/**/*}'
          parent: false
          gzip: true
          headers: |-
            cache-control: public, max-age=3600

      - name: Verify deployment
        run: |
          echo "Deployment complete"
          echo "Site URL : https://reneebuilds.com"
          echo "Bucket   : gs://reneebuilds.com"
          gcloud storage ls gs://reneebuilds.com/ --recursive | head -20
